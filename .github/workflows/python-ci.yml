name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Mondays at 06:00 UTC so staleness that develops while a
    # branch is idle is still caught (a PR-only check would miss it).
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install development tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Verify shared repository automation
      run: cicaid --help

    - name: Verify mcp<2.0.0 pin across MCP server requirements
      run: bash .github/scripts/check_mcp_pin.sh

    - name: Run flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 projects/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. Max line length set to 127
        flake8 projects/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: |
        black --check projects/ || echo "Code formatting issues found. Run 'black projects/' to fix."

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install development tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run each project's test suite in isolation
      run: |
        # Each project gets its own requirements install and its own pytest
        # invocation. This avoids two problems that a single repo-wide
        # `pytest projects/` run hits:
        #   - filename collisions (several projects have their own
        #     test_server.py / server.py with no package structure, which
        #     pytest's default import mode can't disambiguate)
        #   - missing dependencies (a project's own requirements.txt was
        #     never installed when only a root requirements.txt was checked)
        #
        # A "project" is identified per test directory, not per
        # requirements.txt: starting from the directory containing test
        # files, walk up toward projects/ looking for the nearest
        # requirements.txt (handles a tests/ subfolder whose requirements.txt
        # lives in its parent, e.g. projects/04-gmail-inbox-labeler/tests/).
        # If no requirements.txt is found anywhere in that ancestry, the
        # project is still tested (just without an install step) instead of
        # being silently skipped.
        #
        # git-mcp-server's integration test is excluded: it hardcodes a
        # specific developer's local Windows path (not a temp repo) and
        # performs live git commits against it, so it can never pass in CI
        # or on any other machine. Tracked as a follow-up to fix properly
        # rather than papered over here.
        EXCLUDE_ARGS="--ignore=projects/01-mcp-server-suite/servers/git-mcp-server/test_git_server_integration.py"

        declare -A seen
        overall_status=0
        while IFS= read -r test_dir; do
          proj_dir="$test_dir"
          walk="$test_dir"
          while [[ "$walk" == projects/* ]]; do
            if [ -f "$walk/requirements.txt" ]; then
              proj_dir="$walk"
              break
            fi
            walk=$(dirname "$walk")
          done

          [ -n "${seen[$proj_dir]:-}" ] && continue
          seen[$proj_dir]=1

          echo "::group::Testing $proj_dir"
          if [ -f "$proj_dir/requirements.txt" ]; then
            pip install -r "$proj_dir/requirements.txt"
          fi

          pytest "$proj_dir" -v --cov="$proj_dir" --cov-report=term-missing $EXCLUDE_ARGS
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Tests failed in $proj_dir"
            overall_status=1
          fi
          echo "::endgroup::"
        done < <(find projects \( -iname "test_*.py" -o -iname "*_test.py" \) -not -path "*/.venv/*" -exec dirname {} \; | sort -u)
        exit $overall_status

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install development tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run bandit security scan
      run: |
        bandit -r projects/ -ll || echo "Security issues found"

    - name: Check for known vulnerabilities
      run: |
        # Two inputs, because neither alone covers the supply chain.
        #
        # 1. The declared requirements files. `safety check` reads one file,
        #    so every projects/**/requirements.txt is concatenated, plus the
        #    root requirements-dev.txt — that file installs cicaid-devtools
        #    from a GitHub release URL and is part of the surface. `find`
        #    uses -print0/xargs -0 to survive paths with spaces.
        #
        # 2. The installed environment. safety matches advisories to
        #    versions, and every entry in requirements-dev.txt is unpinned
        #    — including cicaid-devtools, whose version lives in the URL and
        #    not in a specifier — so adding that file to input 1 contributes
        #    nothing scannable on its own. `pip list --format=freeze` gives
        #    the concrete versions actually installed, and also covers
        #    transitive dependencies that no requirements file names.
        rm -f all_requirements.txt
        find projects/ -name "requirements.txt" -print0 | xargs -0 -r cat >> all_requirements.txt
        if [ -f requirements-dev.txt ]; then
          cat requirements-dev.txt >> all_requirements.txt
        fi
        pip list --format=freeze > installed_packages.txt

        # Advisory, not blocking: a fresh advisory against a transitive
        # dependency would otherwise break every PR until someone upstream
        # published a fix. But the exit code was previously swallowed by
        # `|| echo`, which makes a finding one line of log output under a
        # green tick that nobody reads. The status is collected instead and
        # written to the job summary, where it is visible without being
        # fatal.
        status=0
        if [ -s all_requirements.txt ]; then
          safety check --file=all_requirements.txt --output=text || status=1
        else
          echo "No declared requirements found to scan"
        fi
        safety check --file=installed_packages.txt --output=text || status=1

        if [ "$status" -ne 0 ]; then
          echo "### :warning: safety reported known vulnerabilities" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "See the *Check for known vulnerabilities* step for details." \
            >> "$GITHUB_STEP_SUMMARY"
        else
          echo "### :white_check_mark: safety found no known vulnerabilities" \
            >> "$GITHUB_STEP_SUMMARY"
        fi

  mcp-pin-selftest:
    name: Self-test mcp-pin check (workflow_dispatch only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify check passes on the real repository
      run: bash .github/scripts/check_mcp_pin.sh

    - name: Verify check fails on a fixture missing the pin
      run: |
        set -euo pipefail

        # Build a throwaway root that mimics the real layout but whose
        # requirements.txt deliberately omits the mcp<2.0.0 pin. The
        # comment below must not itself contain the pin string, or the
        # check's own grep will match the comment and this self-test
        # will always fail (found by actually running it).
        fixture_root="$(mktemp -d)"
        trap 'rm -rf "$fixture_root"' EXIT

        mkdir -p "$fixture_root/projects/01-mcp-server-suite/servers/bad-server"
        cat > "$fixture_root/projects/01-mcp-server-suite/servers/bad-server/requirements.txt" <<'EOF'
        # this file does not declare the required mcp dependency pin
        requests>=2.31.0
        EOF

        set +e
        output="$(bash .github/scripts/check_mcp_pin.sh "$fixture_root" 2>&1)"
        status=$?
        set -e

        echo "$output"

        if [ "$status" -eq 0 ]; then
          echo "::error::Self-test FAILED: check_mcp_pin.sh exited 0 on a fixture missing the pin (silent no-op)"
          exit 1
        fi

        if ! grep -q '::error::FAIL:' <<<"$output"; then
          echo "::error::Self-test FAILED: check_mcp_pin.sh exited non-zero but did not emit the expected ::error::FAIL: message"
          exit 1
        fi

        echo "Self-test OK: check_mcp_pin.sh correctly failed on a fixture missing the pin."

    - name: Verify check fails when no requirements files are discovered
      run: |
        set -euo pipefail

        # Empty fixture root: the glob matches nothing. The check must not
        # pass vacuously.
        fixture_root="$(mktemp -d)"
        trap 'rm -rf "$fixture_root"' EXIT

        set +e
        output="$(bash .github/scripts/check_mcp_pin.sh "$fixture_root" 2>&1)"
        status=$?
        set -e

        echo "$output"

        if [ "$status" -eq 0 ]; then
          echo "::error::Self-test FAILED: check_mcp_pin.sh exited 0 with zero requirements files (vacuous pass)"
          exit 1
        fi

        echo "Self-test OK: check_mcp_pin.sh correctly failed when no requirements files were found."

  pricing-staleness:
    name: Check pricing.json staleness
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Non-blocking by default (mode=warn) per the AI review's suggestion.
    # To make this a hard failure, set STALENESS_MODE=fail below or in the
    # repository's Actions variables. The threshold is configurable via
    # STALENESS_THRESHOLD_MONTHS without editing the script's logic.
    - name: Check pricing.json as_of freshness
      env:
        STALENESS_THRESHOLD_MONTHS: '6'
        STALENESS_MODE: 'warn'
      run: |
        python projects/05-llm-cost-comparison/scripts/check_pricing_staleness.py
