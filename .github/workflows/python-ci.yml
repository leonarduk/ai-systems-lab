name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install development tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Verify shared repository automation
      run: cicaid --help

    - name: Run flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 projects/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. Max line length set to 127
        flake8 projects/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: |
        black --check projects/ || echo "Code formatting issues found. Run 'black projects/' to fix."

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install development tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run each project's test suite in isolation
      run: |
        # Each project gets its own requirements install and its own pytest
        # invocation. This avoids two problems that a single repo-wide
        # `pytest projects/` run hits:
        #   - filename collisions (several projects have their own
        #     test_server.py / server.py with no package structure, which
        #     pytest's default import mode can't disambiguate)
        #   - missing dependencies (a project's own requirements.txt was
        #     never installed when only a root requirements.txt was checked)
        #
        # A "project" is identified per test directory, not per
        # requirements.txt: starting from the directory containing test
        # files, walk up toward projects/ looking for the nearest
        # requirements.txt (handles a tests/ subfolder whose requirements.txt
        # lives in its parent, e.g. projects/04-gmail-inbox-labeler/tests/).
        # If no requirements.txt is found anywhere in that ancestry, the
        # project is still tested (just without an install step) instead of
        # being silently skipped.
        #
        # git-mcp-server's integration test is excluded: it hardcodes a
        # specific developer's local Windows path (not a temp repo) and
        # performs live git commits against it, so it can never pass in CI
        # or on any other machine. Tracked as a follow-up to fix properly
        # rather than papered over here.
        EXCLUDE_ARGS="--ignore=projects/01-mcp-server-suite/servers/git-mcp-server/test_git_server_integration.py"

        declare -A seen
        overall_status=0
        while IFS= read -r test_dir; do
          proj_dir="$test_dir"
          walk="$test_dir"
          while [[ "$walk" == projects/* ]]; do
            if [ -f "$walk/requirements.txt" ]; then
              proj_dir="$walk"
              break
            fi
            walk=$(dirname "$walk")
          done

          [ -n "${seen[$proj_dir]:-}" ] && continue
          seen[$proj_dir]=1

          echo "::group::Testing $proj_dir"
          if [ -f "$proj_dir/requirements.txt" ]; then
            pip install -r "$proj_dir/requirements.txt"
          fi

          pytest "$proj_dir" -v --cov="$proj_dir" --cov-report=term-missing $EXCLUDE_ARGS
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Tests failed in $proj_dir"
            overall_status=1
          fi
          echo "::endgroup::"
        done < <(find projects \( -iname "test_*.py" -o -iname "*_test.py" \) -not -path "*/.venv/*" -exec dirname {} \; | sort -u)
        exit $overall_status

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install development tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run bandit security scan
      run: |
        bandit -r projects/ -ll || echo "Security issues found"

    - name: Check for known vulnerabilities
      run: |
        # Build the safety input from every project requirements.txt plus the
        # root requirements-dev.txt. The root file installs shared repository
        # automation (cicaid-devtools) from a GitHub release URL, so it is part
        # of the supply-chain surface and must be scanned alongside the
        # per-project requirements.
        #
        # `safety check` reads a single requirements file, so we concatenate
        # all of them into one temporary file. `find` is run with `-print0`
        # and `xargs -0` to be safe against paths with spaces.
        rm -f all_requirements.txt
        find projects/ -name "requirements.txt" -print0 | xargs -0 -r cat >> all_requirements.txt
        if [ -f requirements-dev.txt ]; then
          cat requirements-dev.txt >> all_requirements.txt
        fi

        if [ -s all_requirements.txt ]; then
          safety check --file=all_requirements.txt --output=text || echo "Vulnerabilities found"
        else
          echo "No requirements found to scan"
        fi
