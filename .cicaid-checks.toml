# Local check list for cicaid-devtools' `cicaid` CLI (see requirements-dev.txt).
#
# Without this file, cicaid falls back to its DEFAULT_CHECKS, which are
# allotmint's own checks (a `python scripts/check_contract_version_sync.py`
# script, mypy over a `backend/` package, etc.) — none of which exist in this
# repo. That fallback was causing every issue-worm-pro run against this repo
# to fail on an unrelated, nonexistent script before ever reaching real
# verification. These checks mirror the `lint` and `security` jobs of
# .github/workflows/python-ci.yml (not the full workflow).
#
# .github/scripts/test_extract_verdict.py shells out to a hardcoded
# `python3`, which isn't on PATH on Windows, so it's excluded (along with
# the git-mcp-server integration test, for the same reason python-ci.yml
# excludes it) by .github/scripts/run_project_tests.py below. Everything
# under projects/ itself has no such issue and is safe to run locally.

[[checks]]
name = "test"
description = "Per-project pytest suite (mirrors the \"test\" job in python-ci.yml)"
workflow = ".github/workflows/python-ci.yml (test)"
commands = [
    # Regression-tests the discovery logic itself first (#255's review
    # found a real bug in it) -- a broken verifier script silently
    # skipping projects is exactly the failure mode this check exists to
    # close.
    "python -m pytest .github/scripts/test_run_project_tests.py -q",
    "python .github/scripts/run_project_tests.py",
]

[[checks]]
name = "lint"
description = "Flake8 syntax/lint check (black formatting is advisory in CI, not blocking)"
workflow = ".github/workflows/python-ci.yml (lint)"
commands = [
    "flake8 projects/ --count --select=E9,F63,F7,F82 --show-source --statistics",
]

[[checks]]
name = "security"
description = "Bandit static security scan (advisory on findings; execution errors still fail the check)"
workflow = ".github/workflows/python-ci.yml (security)"
commands = [
    "bandit -r projects/ -ll --exit-zero",
]
